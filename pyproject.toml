[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavemio"
version = "2.12.4"
description = "WaveCode: a from-scratch CLI coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "pygments>=2.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "ruff>=0.6",
]

[project.scripts]
wavecode = "coding_agent.cli.app:main"
wavemio = "coding_agent.cli.app:main"
coding-agent = "coding_agent.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_agent = ["py.typed", "cli/sprites/packs/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = [
  "-q",
  "-p", "pytest_cov",
  "-p", "pytest_socket",
  "--disable-socket",
  "--allow-unix-socket",
  "-m",
  "not network",
  "--cov=coding_agent",
  "--cov-report=term-missing",
]
markers = [
  "network: hits the network (never in default CI)",
]

[tool.coverage.run]
branch = true
source = ["coding_agent"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The system prompt template is used verbatim per docs/10 §4.
"src/coding_agent/app/system_prompt.py" = ["E501"]
